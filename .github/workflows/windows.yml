name: Windows build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.0
          cache: true

      - name: Build
        run: |
          flutter pub get
          flutter build windows --release

      - name: Add official Windows ADB (Google platform-tools)
        shell: pwsh
        run: |
          $rel = "build/windows/x64/runner/Release"
          Invoke-WebRequest -Uri "https://dl.google.com/android/repository/platform-tools-latest-windows.zip" -OutFile pt.zip
          Expand-Archive pt.zip -DestinationPath pt
          New-Item -ItemType Directory -Force "$rel/adb" | Out-Null
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll "$rel/adb/"
          Copy-Item README-WINDOWS.txt "$rel/README.txt"
          New-Item -ItemType Directory -Force out/BoxFlasher | Out-Null
          Copy-Item "$rel/*" out/BoxFlasher -Recurse
          Compress-Archive -Path out/BoxFlasher -DestinationPath BoxFlasher-windows.zip

      - uses: actions/upload-artifact@v4
        with:
          name: BoxFlasher-windows
          path: BoxFlasher-windows.zip

      - name: Attach to release (tags only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: BoxFlasher-windows.zip
